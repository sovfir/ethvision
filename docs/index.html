<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="screen-orientation" content="portrait">
    <meta name="orientation" content="portrait-primary">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>EthVision</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231a1a2e'/><rect x='10' y='70' width='15' height='20' fill='%2350c850'/><rect x='28' y='50' width='15' height='40' fill='%23c85050'/><rect x='46' y='30' width='15' height='60' fill='%2350c850'/><rect x='64' y='55' width='15' height='35' fill='%23c85050'/><rect x='82' y='20' width='15' height='70' fill='%2350c850'/><line x1='10' y1='85' x2='97' y2='85' stroke='%23f0c050' stroke-width='2'/></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background: #000000;
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            display: block;
            margin: 0 auto;
            width: 100%;
            height: auto;
            aspect-ratio: 360 / 640;
            max-height: 100vh;
            object-fit: contain;
            cursor: pointer;
        }

        .status {
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        
        WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject).then(async (result) => {
            await go.run(result.instance);
        }).catch((err) => {
            console.error(err);
            document.body.innerHTML = '<div style="color:red;text-align:center;margin-top:50px;">Error loading app</div>';
        });
        
        // Блокировка поворота
        function lockOrientation() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(e => console.log('not supported'));
            }
        }
        lockOrientation();
        window.addEventListener('orientationchange', lockOrientation);
    </script>
</body>
</html>
